name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  APPIMAGE: Hantek_365F-x86_64.AppImage

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-charts-dev qt6-serialport-dev qt6-qpa-plugins

      - name: Build GUI tests
        run: |
          cmake -S hantek365_gui -B build -DBUILD_TESTING=ON
          cmake --build build -j"$(nproc)"

      - name: GUI tests
        run: ctest --test-dir build --output-on-failure

      - name: CLI tests
        run: python3 -m unittest discover -s tests -v

  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from the tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build AppImage on AlmaLinux 8 (glibc 2.28)
        run: >
          docker run --rm -v "$PWD":/src -w /src -e APP_VERSION
          almalinux:8.10 ci/build-appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APPIMAGE }}
          path: dist/${{ env.APPIMAGE }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.APPIMAGE }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "$APPIMAGE"
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
